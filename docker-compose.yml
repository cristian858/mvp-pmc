version: '3.9'

services:
  # Servicio principal: SafeSign AI Backend
  safesign-backend:
    build:
      context: .
      dockerfile: Dockerfile
      # Soporta múltiples arquitecturas automáticamente
      # En M4 Mac: usa linux/arm64
      # En Intel Mac/Linux: usa linux/amd64
    container_name: safesign-backend
    
    # Puertos expuestos
    ports:
      - "${FLASK_PORT:-5000}:5000"
    
    # Variables de entorno
    environment:
      # Flask
      FLASK_APP: scripts/serve.py
      FLASK_ENV: ${FLASK_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/instance/safesign.db}
      
      # Biometría
      UMBRAL_MOVIMIENTO: ${UMBRAL_MOVIMIENTO:-0.03}
      TESSERACT_CMD: ${TESSERACT_CMD:-/usr/bin/tesseract}
      
      # IA
      USE_MOCK_AI: ${USE_MOCK_AI:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      
      # Python
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    
    # Volúmenes para persistencia de datos
    volumes:
      # Datos de aplicación
      - ./data/uploads:/app/data/uploads:rw
      - ./data/capturas:/app/data/capturas:rw
      - ./data/signatures:/app/data/signatures:rw
      
      # Base de datos SQLite
      - ./instance:/app/instance:rw
      
      # Código fuente (para hot reload en desarrollo)
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ./.env:/app/.env:ro
    
    # Política de reinicio
    restart: unless-stopped
    
    # Configuración de healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Redes
    networks:
      - safesign-network
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Red personalizada para servicios
networks:
  safesign-network:
    driver: bridge

# Volúmenes nombrados (opcional, para mayor control)
volumes:
  safesign-db:
    driver: local
  safesign-uploads:
    driver: local
